name: Build RPX
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure wut
        run: dkp-pacman -S --needed --noconfirm wut || dkp-pacman -S --needed --noconfirm wiiu-dev
      - name: Build
        run: make
      - name: Package
        run: |
          mkdir -p out/wiiu/apps/seb
          cp seb.rpx out/wiiu/apps/seb/
          cp dist/wiiu/apps/seb/meta.xml out/wiiu/apps/seb/
      - uses: actions/upload-artifact@v4
        with:
          name: seb-wiiu
          path: out
